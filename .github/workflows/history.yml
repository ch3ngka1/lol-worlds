name: 重建歷史戰績
on:
  workflow_dispatch:
  push:
    paths: ['scripts/**']
permissions:
  contents: write
concurrency: { group: update-data, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build_history.py && python3 scripts/update.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "重建歷史戰績" && git pull --rebase && git push
