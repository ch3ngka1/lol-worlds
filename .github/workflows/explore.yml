name: explore
on:
  push:
    paths: ['scripts/explore.json']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: 取消卡住的舊探索
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          for id in $(gh run list -R "$GITHUB_REPOSITORY" -w explore -s in_progress --json databaseId -q '.[].databaseId'); do
            [ "$id" != "$GITHUB_RUN_ID" ] && gh run cancel "$id" -R "$GITHUB_REPOSITORY" || true
          done
      - uses: actions/checkout@v4
      - run: python3 scripts/explore.py
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add explore-output.json; git commit -m "explore output [skip ci]" && git pull --rebase && git push
