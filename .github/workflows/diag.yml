name: diag
on:
  push:
    paths: ['.github/workflows/diag.yml']
permissions:
  contents: write
  actions: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          for id in $(gh run list -R "$GITHUB_REPOSITORY" -w explore -s in_progress --json databaseId -q '.[].databaseId'); do gh run cancel "$id" -R "$GITHUB_REPOSITORY" || true; done
      - uses: actions/checkout@v4
      - run: |
          UA="lol-worlds-fan-site/1.0 (https://github.com/ch3ngka1/lol-worlds)"
          U='https://lol.fandom.com/wiki/Special:CargoExport?tables=MatchSchedule&fields=Team1,Team2,Winner&where=OverviewPage%20LIKE%20%222026%20Season%20World%20Championship%25%22&limit=3&format=json'
          {
          echo "== export UA -I"; curl -sS -m 30 -A "$UA" -I "$U" | head -20
          echo "== export -L"; curl -sS -L -m 60 -A "$UA" -o b1 -w "%{http_code} %{content_type} %{url_effective} %{num_redirects}\n" "$U"; head -c 400 b1; echo
          echo "== export browser UA"; curl -sS -m 30 -A "Mozilla/5.0" -o b2 -w "%{http_code} %{content_type} %{time_total}\n" "$U"; head -c 300 b2; echo
          echo "== api"; curl -sS -m 30 -A "$UA" -o b3 -w "%{http_code} %{time_total}\n" "https://lol.fandom.com/api.php?action=cargoquery&format=json&tables=Teams&fields=Name&limit=1"; head -c 300 b3; echo
          } > diag-output.txt 2>&1
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diag-output.txt; git commit -m "diag2 output [skip ci]" && git pull --rebase && git push
