name: probe-data-sources
on:
  push:
    paths: ['.github/workflows/probe.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          UA="lol-worlds-fan-site (github.com/ch3ngka1/lol-worlds)"
          {
          for i in 1 2 3; do
            echo "== cargo try $i"
            curl -sS -A "$UA" "https://lol.fandom.com/api.php?action=cargoquery&format=json&tables=ScoreboardGames&fields=Team1,Team2,WinTeam,Tournament,DateTime_UTC&where=Tournament%20LIKE%20%22Worlds%202025%25%22&limit=3" | head -c 600; echo; sleep 5
          done
          echo "== 2026 schedule"
          curl -sS -A "$UA" "https://lol.fandom.com/api.php?action=cargoquery&format=json&tables=MatchSchedule&fields=Team1,Team2,Team1Score,Team2Score,Winner,DateTime_UTC,OverviewPage&where=OverviewPage%20LIKE%20%222026%20Season%20World%20Championship%25%22&order_by=DateTime_UTC&limit=20" | head -c 3000; echo
          } > probe-output.txt 2>&1
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe-output.txt; git commit -m "probe output [skip ci]"; git push
