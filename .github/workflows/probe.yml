name: probe
on:
  push:
    paths: ['scripts/probe_fields.py']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/probe_fields.py || echo failed
      - if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe-output.json; git commit -m "probe [skip ci]" && git pull --rebase && git push
